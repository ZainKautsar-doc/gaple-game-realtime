<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" fill="none" role="img" aria-labelledby="gaLogoTitle gaLogoDesc">
  <title id="gaLogoTitle">Gaple Arena</title>
  <desc id="gaLogoDesc">Simbol kartu gaple multiplayer — pola mata klasik dengan aksen neo-brutalis</desc>
  <!-- Bayangan keras (offset) -->
  <rect x="18" y="18" width="40" height="48" fill="#e7e700" stroke="#000000" stroke-width="4"/>
  <!-- Kopling utama -->
  <rect x="12" y="12" width="40" height="48" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <!-- Garis tengah kopling -->
  <line x1="32" y1="14" x2="32" y2="50" stroke="#000000" stroke-width="4" stroke-linecap="square"/>
  <!-- Sisi kiri |4| pojok -->
  <rect x="15" y="18" width="8" height="8" fill="#000000"/>
  <rect x="23" y="18" width="8" height="8" fill="#000000"/>
  <rect x="15" y="38" width="8" height="8" fill="#000000"/>
  <rect x="23" y="38" width="8" height="8" fill="#000000"/>
  <!-- Sisi kanan |4| pojok -->
  <rect x="39" y="18" width="8" height="8" fill="#000000"/>
  <rect x="47" y="18" width="8" height="8" fill="#000000"/>
  <rect x="39" y="38" width="8" height="8" fill="#000000"/>
  <rect x="47" y="38" width="8" height="8" fill="#000000"/>
  <!-- Strip merek (bawah kartu, menyatu dengan bingkai) -->
  <rect x="16" y="50" width="32" height="8" fill="#0001bb" stroke="#000000" stroke-width="3"/>
  <rect x="28" y="52.5" width="8" height="3" fill="#e7e700"/>
</svg>
